<!doctype html>
<meta charset="utf-8">
<title>Freakbot tests</title>
<pre id="out">running</pre>
<script type="module">
import { addDays, emptySave, ensureDay, gradeCard, mergeSaves, pickDaily, recompute, stable, timeBand } from './js/rules.js';
import { createStore } from './js/store.js';

const results = [];
async function test(name, fn) {
  try {
    await fn();
    results.push(`ok   ${name}`);
  } catch (e) {
    results.push(`FAIL ${name}: ${e.message}`);
  }
}
const eq = (a, b) => {
  if (stable(a) !== stable(b)) throw new Error(`${stable(a)} != ${stable(b)}`);
};

const NOW = (day) => `${day}T15:00:00.000Z`;
const deck = (n, paper = (i) => `P${i}`) => Array.from({ length: n }, (_, i) => ({ id: `c${i}`, paper: paper(i) }));

function playDay(save, cards, day, grade = 'got') {
  ensureDay(save, cards, day, NOW(day));
  for (const id of save.days[day].cards) gradeCard(save, id, day, { grade }, NOW(day));
}
function memStorage(seed = {}) {
  const m = new Map(Object.entries(seed));
  return { getItem: (k) => (m.has(k) ? m.get(k) : null), setItem: (k, v) => m.set(k, v), removeItem: (k) => m.delete(k) };
}
const b64 = (s) => btoa(String.fromCharCode(...new TextEncoder().encode(s)));

function fakeGitHub({ initial = null, conflictOnce = false, status = null } = {}) {
  const gh = { content: initial, sha: initial ? 's0' : null, puts: 0, conflicted: !conflictOnce, seenAuth: [], beforePut: null };
  gh.fetch = async (url, opts = {}) => {
    gh.seenAuth.push(opts.headers?.Authorization);
    const reply = (code, body) => new Response(body ? JSON.stringify(body) : null, { status: code });
    if (status) return reply(status);
    if ((opts.method ?? 'GET') === 'GET') {
      if (!gh.content) return reply(404, {});
      return reply(200, { sha: gh.sha, content: b64(gh.content) });
    }
    const body = JSON.parse(opts.body);
    if (!gh.conflicted) {
      gh.conflicted = true;
      gh.beforePut?.(gh);
      return reply(409, {});
    }
    if (body.sha !== (gh.sha ?? undefined)) return reply(409, {});
    gh.content = new TextDecoder().decode(Uint8Array.from(atob(body.content), (c) => c.charCodeAt(0)));
    gh.sha = `s${++gh.puts}`;
    return reply(200, { content: { sha: gh.sha } });
  };
  return gh;
}

await test('time bands match 4.3', () => {
  eq([4, 5, 10, 11, 16, 17, 20, 21, 0].map(timeBand), ['night', 'morning', 'morning', 'day', 'day', 'golden', 'golden', 'night', 'night']);
});

await test('addDays crosses a DST change and a month end', () => {
  eq(addDays('2026-11-01', 1), '2026-11-02');
  eq(addDays('2026-10-31', 1), '2026-11-01');
});

await test('daily pick is fixed by date', () => {
  const responses = Object.fromEntries(deck(8).map((c) => [c.id, { grade: 'missed', day: '2026-11-01' }]));
  eq(pickDaily(deck(8), responses, '2026-11-09'), pickDaily(deck(8), responses, '2026-11-09'));
});

await test('new cards fill in file order when there are no reviews', () => {
  eq(pickDaily(deck(5), {}, '2026-11-09'), ['c0', 'c1', 'c2']);
});

await test('one slot is reserved for a new card when reviews could fill all 3', () => {
  const r = Object.fromEntries(deck(5).map((c) => [c.id, { grade: 'missed', day: '2026-11-01' }]));
  const picks = pickDaily(deck(6), r, '2026-11-09');
  eq([picks.length, picks.filter((id) => id === 'c5').length, picks[2]], [3, 1, 'c5']);
});

await test('all 3 slots go to reviews once no new cards remain', () => {
  const r = Object.fromEntries(deck(5).map((c) => [c.id, { grade: 'missed', day: '2026-11-01' }]));
  eq(pickDaily(deck(5), r, '2026-11-09').length, 3);
});

await test('knew-it cards are skipped for 3 days, then return', () => {
  const r = { c0: { grade: 'got', day: '2026-11-07' } };
  eq(pickDaily(deck(1), r, '2026-11-09'), []);
  eq(pickDaily(deck(1), r, '2026-11-10'), ['c0']);
});

await test('reviews prefer different papers', () => {
  const cards = deck(6, (i) => (i < 3 ? 'A' : `B${i}`));
  const r = Object.fromEntries(cards.map((c) => [c.id, { grade: 'missed', day: '2026-11-01' }]));
  const papers = pickDaily(cards, r, '2026-11-09').map((id) => cards.find((c) => c.id === id).paper);
  eq(new Set(papers).size, 3);
});

await test('answers earn 10, 6 and 3 water', () => {
  const s = emptySave();
  ensureDay(s, deck(3), '2026-11-09', NOW('2026-11-09'));
  gradeCard(s, 'c0', '2026-11-09', { grade: 'got' }, NOW('2026-11-09'));
  gradeCard(s, 'c1', '2026-11-09', { grade: 'partial' }, NOW('2026-11-09'));
  eq(s.days['2026-11-09'].done, false);
  gradeCard(s, 'c2', '2026-11-09', { grade: 'missed' }, NOW('2026-11-09'));
  eq([s.profile.water, s.profile.streak, s.days['2026-11-09'].done], [19, 1, true]);
});

await test('grading the same card twice earns water once', () => {
  const s = emptySave();
  ensureDay(s, deck(3), '2026-11-09', NOW('2026-11-09'));
  gradeCard(s, 'c0', '2026-11-09', { grade: 'got' }, NOW('2026-11-09'));
  gradeCard(s, 'c0', '2026-11-09', { grade: 'got' }, NOW('2026-11-09'));
  eq(s.profile.water, 10);
});

await test('fewer than 3 available still completes the day', () => {
  const s = emptySave();
  playDay(s, deck(2), '2026-11-09');
  eq([s.days['2026-11-09'].cards.length, s.days['2026-11-09'].done, s.profile.streak], [2, true, 1]);
});

await test('nothing due counts as done with no water', () => {
  const s = emptySave();
  ensureDay(s, [], '2026-11-09', NOW('2026-11-09'));
  eq([s.days['2026-11-09'].done, s.profile.water, s.profile.streak], [true, 0, 1]);
});

await test('7-day streak earns a freeze, a missed day spends it', () => {
  const s = emptySave();
  let d = '2026-11-01';
  for (let i = 0; i < 7; i++, d = addDays(d, 1)) playDay(s, deck(40), d, 'missed');
  eq([s.profile.streak, s.profile.freezes], [7, 1]);
  playDay(s, deck(40), addDays(d, 1), 'missed');
  eq([s.profile.streak, s.profile.freezes, s.days[d].frozen], [8, 0, true]);
});

await test('a miss with no freeze resets the streak, today alone does not', () => {
  const s = emptySave();
  playDay(s, deck(9), '2026-11-01');
  eq(recompute(s, '2026-11-02').profile.streak, 1);
  eq(recompute(s, '2026-11-03').profile.streak, 0);
  eq(s.profile.best, 1);
});

await test('freezes cap at 2', () => {
  const s = emptySave();
  let d = '2026-09-01';
  for (let i = 0; i < 21; i++, d = addDays(d, 1)) playDay(s, deck(70), d, 'missed');
  eq(s.profile.freezes, 2);
});

await test('merge combines two devices that graded different cards of one day', () => {
  const day = '2026-11-09';
  const a = emptySave();
  ensureDay(a, deck(3), day, `${day}T10:00:00.000Z`);
  const b = JSON.parse(JSON.stringify(a));
  gradeCard(a, 'c0', day, { grade: 'got' }, `${day}T11:00:00.000Z`);
  gradeCard(b, 'c1', day, { grade: 'partial' }, `${day}T12:00:00.000Z`);
  gradeCard(b, 'c2', day, { grade: 'partial' }, `${day}T12:01:00.000Z`);
  const m = mergeSaves(a, b, day);
  eq([m.days[day].water, m.days[day].done, m.profile.water, m.profile.streak], [22, true, 22, 1]);
  eq(stable(m), stable(mergeSaves(b, a, day)));
});

await test('merge keeps the newer response and a done day over a newer unfinished one', () => {
  const a = emptySave();
  const b = emptySave();
  a.responses.c0 = { grade: 'missed', at: '2026-11-01T00:00:00Z', day: '2026-11-01' };
  b.responses.c0 = { grade: 'got', at: '2026-11-02T00:00:00Z', day: '2026-11-02' };
  a.days['2026-11-01'] = { cards: [], done: true, frozen: false, water: 3, at: '2026-11-01T01:00:00Z' };
  b.days['2026-11-01'] = { cards: [], done: false, frozen: false, water: 0, at: '2026-11-01T02:00:00Z' };
  const m = mergeSaves(a, b, '2026-11-02');
  eq([m.responses.c0.grade, m.days['2026-11-01'].done, m.days['2026-11-01'].water], ['got', true, 3]);
});

const today = () => '2026-11-09';

await test('sync without a token reports missing and makes no calls', async () => {
  const gh = fakeGitHub();
  const store = createStore({ storage: memStorage(), fetchFn: gh.fetch, today });
  await store.sync();
  eq([store.status, gh.seenAuth.length], ['missing', 0]);
});

await test('first sync creates save.json with no sha', async () => {
  const gh = fakeGitHub();
  const store = createStore({ storage: memStorage({ 'freakbot.token': 'T' }), fetchFn: gh.fetch, today });
  store.commit((s, now) => ensureDay(s, deck(3), today(), now));
  await store.sync();
  eq([store.status, gh.puts, JSON.parse(gh.content).days[today()].cards.length], ['ok', 1, 3]);
});

await test('a graded card reaches the other device', async () => {
  const gh = fakeGitHub();
  const phone = createStore({ storage: memStorage({ 'freakbot.token': 'T' }), fetchFn: gh.fetch, today });
  const mac = createStore({ storage: memStorage({ 'freakbot.token': 'T' }), fetchFn: gh.fetch, today });
  phone.commit((s, now) => ensureDay(s, deck(3), today(), now));
  phone.commit((s, now) => gradeCard(s, 'c0', today(), { grade: 'got', text: 'ñandú – “x”' }, now));
  await phone.sync();
  await mac.sync();
  eq([mac.save.responses.c0.grade, mac.save.responses.c0.text, mac.save.profile.water], ['got', 'ñandú – “x”', 10]);
});

await test('sha conflict fetches, merges and retries once', async () => {
  const seed = emptySave();
  ensureDay(seed, deck(3), today(), `${today()}T10:00:00.000Z`);
  const gh = fakeGitHub({ initial: JSON.stringify(seed), conflictOnce: true });
  gh.beforePut = () => {
    const other = JSON.parse(gh.content);
    gradeCard(other, 'c1', today(), { grade: 'partial' }, `${today()}T12:00:00.000Z`);
    gh.content = JSON.stringify(other);
    gh.sha = 'other';
  };
  const store = createStore({ storage: memStorage({ 'freakbot.token': 'T', 'freakbot.save': JSON.stringify(seed) }), fetchFn: gh.fetch, today });
  store.commit((s, now) => gradeCard(s, 'c0', today(), { grade: 'got' }, now));
  await store.sync();
  const saved = JSON.parse(gh.content);
  eq([store.status, Object.keys(saved.responses).sort(), saved.profile.water], ['ok', ['c0', 'c1'], 16]);
});

await test('rejected token is reported and local progress survives', async () => {
  const gh = fakeGitHub({ status: 401 });
  const storage = memStorage({ 'freakbot.token': 'BAD' });
  const store = createStore({ storage, fetchFn: gh.fetch, today });
  store.commit((s, now) => ensureDay(s, deck(3), today(), now));
  await store.sync();
  eq([store.status, Boolean(JSON.parse(storage.getItem('freakbot.save')).days[today()])], ['rejected', true]);
});

await test('network failure reports offline', async () => {
  const store = createStore({
    storage: memStorage({ 'freakbot.token': 'T' }),
    fetchFn: async () => { throw new TypeError('Failed to fetch'); },
    today,
  });
  await store.sync();
  eq(store.status, 'offline');
});

await test('an unrecognized remote file is never overwritten', async () => {
  const gh = fakeGitHub({ initial: '{"v":99}' });
  const store = createStore({ storage: memStorage({ 'freakbot.token': 'T' }), fetchFn: gh.fetch, today });
  store.commit((s, now) => ensureDay(s, deck(3), today(), now));
  await store.sync();
  eq([store.status, gh.content, gh.puts], ['error', '{"v":99}', 0]);
});

const failed = results.filter((r) => r.startsWith('FAIL')).length;
document.getElementById('out').textContent = `${results.join('\n')}\n\n${results.length - failed} passed, ${failed} failed`;
document.title = failed ? 'FAILED' : 'PASSED';
</script>
